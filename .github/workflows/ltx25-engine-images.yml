name: Build Mashhad LTX-2.5 engine images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'direct-fast/**'
      - 'comfy-fast/**'
      - '.github/workflows/ltx25-engine-images.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: direct
            context: ./direct-fast
            image: ltx25-direct-fast
          - engine: comfyui
            context: ./comfy-fast
            image: ltx25-comfy-fast
    name: ${{ matrix.engine }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.engine }}
          cache-to: type=gha,mode=max,scope=${{ matrix.engine }}
