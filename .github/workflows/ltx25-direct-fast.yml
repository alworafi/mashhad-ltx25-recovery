name: Build LTX-2.5 DIRECT FAST
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'direct-fast/**'
      - '.github/workflows/ltx25-direct-fast.yml'
permissions:
  contents: read
  packages: write
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./direct-fast
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ltx25-direct-fast:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
